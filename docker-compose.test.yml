name: serve-test

x-override: &override
  container_name: serve-backend_test
  volumes:
    - configs:/var/serve/configs
    - models:/var/serve/models
  command: webserver

volumes:
  configs:
  models:

services:
  backend:
    <<: *override

  backend-cpu:
    <<: *override

  traefik:
    container_name: serve-traefik_test
    volumes:
      - configs:/etc/traefik/configs
    ports:
      - 7500:80
      - 7510:8080

  sentinel:
    container_name: serve-sentinel_test

  builder:
    container_name: serve-builder_test

  database:
      container_name: serve-database_test

  redis:
    container_name: serve-redis_test

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: serve-azurite_test
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Same image as the backend, but with a different command
  # Runs the tests inside the container, calling the backend
  tester:
    image: ghcr.io/links-ads/serve-backend:${PROJECT_VERSION:-latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - configs:/var/serve/configs
      - models:/var/serve/models
    env_file:
      - .env
    environment:
      - RUN_MIGRATIONS=false  # assume backend runs them
      - AZURITE_ACCOUNT=devstoreaccount1
      - AZURITE_KEY=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
      - AZURITE_ENDPOINT=http://azurite:10000/devstoreaccount1
    depends_on:
      database:
        condition: service_healthy
      traefik:
        condition: service_healthy
      azurite:
        condition: service_healthy
    container_name: serve-tester_test
    command: test
    tty: true
